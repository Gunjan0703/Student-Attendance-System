apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-frontend
  template:
    metadata:
      labels:
        app: management-frontend
    spec:
      containers:
      - name: management-frontend
        image: gunjan1603/management-frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: management-frontend
spec:
  type: NodePort
  selector:
    app: management-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30002

